<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>love2note</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="topbar__left">
        <button class="iconbtn" id="menuBtn">☰</button>
        <a
          class="brand"
          href="#"
          onclick="
            setView('schedule');
            return false;
          "
        >
          <span class="brand__mark">🍃</span>
          <span class="brand__name">love2note</span>
        </a>
      </div>

      <div class="topbar__right">
        <div class="search">
          <input class="search__input" placeholder="검색" />
          <button class="search__btn">⌕</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidecard">
          <div class="sidecard__head">
            <div class="sidecard__title">📁 카테고리</div>
          </div>

          <nav class="sidelist">
            <a class="sidelist__item is-active" href="#" data-view="schedule">
              <span class="sidelist__icon">🏠</span>
              <span class="sidelist__text">전체 글 (홈)</span>
            </a>
            <a class="sidelist__item" href="#" data-view="diary">
              <span class="sidelist__icon">📖</span>
              <span class="sidelist__text">일기장</span>
            </a>
            <a class="sidelist__item" href="#" data-view="memo">
              <span class="sidelist__icon">📝</span>
              <span class="sidelist__text">개인 메모</span>
            </a>
            <a class="sidelist__item" href="#" data-view="ledger">
              <span class="sidelist__icon">💰</span>
              <span class="sidelist__text">가계부</span>
            </a>
          </nav>
        </div>
      </aside>

      <main class="main">
        <section class="card" id="view-schedule">
          <div class="card__head">
            <h2 class="card__title">일정</h2>
            <button class="btn btn--ghost" id="toggleCalView">
              간략히보기
            </button>
          </div>

          <div class="calendar-container" id="calendarContainer">
            <div class="calendar-selected">
              <div class="cal-nav">
                <button id="calPrev">◀</button>
                <span id="calYM">2026.01</span>
                <button id="calNext">▶</button>
              </div>
              <div class="selected-day-big" id="selectedDayNum">23</div>
              <div class="selected-day-text" id="selectedDayName">(금요일)</div>

              <button class="btn btn--add" id="openAddForm">+ 추가</button>
            </div>

            <div class="calendar-grid-wrapper">
              <div class="calendar-grid" id="calendarGrid"></div>
            </div>
          </div>

          <div class="schedule-form" id="scheduleForm" hidden>
            <div class="form-header">
              <span id="formDateText">2026.01.23</span>
              <div class="form-btns">
                <button class="btn btn--save" id="saveSchedule">저장</button>
                <button class="btn btn--cancel" id="closeAddForm">취소</button>
              </div>
            </div>
            <input
              type="text"
              class="field__input"
              id="schedTitle"
              placeholder="여기에 제목을 입력하세요"
            />
            <textarea
              class="field__input textarea--sm"
              id="schedContent"
              placeholder="여기에 내용을 입력하세요"
            ></textarea>
          </div>

          <div class="schedule-list-footer" id="scheduleDisplay">
            등록된 일정이 없습니다.
          </div>
        </section>

        <section class="card" id="view-memo" hidden>
          <div class="card__head">
            <h2 class="card__title">개인 메모</h2>
            <button class="btn btn--primary" id="memoNewBtn">+ 새 메모</button>
          </div>
          <div class="memo-layout">
            <div class="memo-list" id="memoList"></div>
            <div class="memo-editor">
              <input class="field__input" id="memoTitle" placeholder="제목" />
              <textarea
                class="field__input textarea"
                id="memoContent"
                placeholder="내용"
              ></textarea>
              <button class="btn btn--primary" id="memoSaveBtn">저장</button>
            </div>
          </div>
        </section>

        <section class="card" id="view-diary" hidden>
          <h2>일기장 준비 중...</h2>
        </section>
        <section class="card" id="view-ledger" hidden>
          <h2>가계부 준비 중...</h2>
        </section>

        <div class="dashboard" id="dashboard-area">
          <div class="dashboard__row">
            <section class="card dashboard__memo">
              <div class="card__head">
                <h3 class="card__subtitle">📝 최근 메모</h3>
                <button class="btn btn--ghost" onclick="setView('memo')">
                  전체보기
                </button>
              </div>
              <div class="memo-gallery">
                <div class="memo-card">
                  <div class="memo-card__title">오늘의 아이디어</div>
                  <div class="memo-card__desc">
                    새로운 개인 사이트 레이아웃 수정하기...
                  </div>
                </div>
                <div class="memo-card">
                  <div class="memo-card__title">장보기 목록</div>
                  <div class="memo-card__desc">
                    사과, 우유, 시리얼, 세이지 그린 페인트...
                  </div>
                </div>
                <div class="memo-card">
                  <div class="memo-card__title">비밀번호 찾기</div>
                  <div class="memo-card__desc">
                    잊어버리지 않게 조심해야 할 것들...
                  </div>
                </div>
              </div>
            </section>

            <section class="card dashboard__spending">
              <div class="card__head">
                <h3 class="card__subtitle">💰 이번 달 소비</h3>
              </div>
              <div class="spending-box">
                <div class="spending-amount">450,000원</div>
                <div class="spending-bar-container">
                  <div class="spending-bar" style="width: 65%"></div>
                </div>
                <p class="spending-hint">
                  지난달보다 <strong>12,000원</strong> 덜 썼어요!
                </p>
              </div>
            </section>
          </div>
        </div>
      </main>

      <aside class="right">
        <section class="panel" id="login-panel">
          <div class="panel__head">
            <div class="panel__title">로그인</div>
          </div>
          <form class="login" onsubmit="return false;">
            <input
              class="field__input"
              id="loginEmail"
              type="email"
              placeholder="이메일"
            />
            <input
              class="field__input"
              id="loginPw"
              type="password"
              placeholder="비밀번호"
            />
            <div
              style="
                display: flex;
                align-items: center;
                gap: 6px;
                margin-top: 4px;
                margin-bottom: 10px;
              "
            >
              <input type="checkbox" id="saveIdCheck" style="cursor: pointer" />
              <label
                for="saveIdCheck"
                style="font-size: 12px; color: var(--muted); cursor: pointer"
                >아이디 저장</label
              >
            </div>
            <div class="login__actions" style="display: grid; gap: 8px">
              <button class="btn btn--primary w-full" id="loginBtn">
                로그인
              </button>
              <button
                class="btn btn--ghost w-full"
                id="signupBtn"
                style="font-size: 12px; color: var(--muted)"
              >
                회원가입
              </button>
            </div>
          </form>
        </section>

        <section class="panel" id="user-panel" hidden>
          <div class="panel__head">
            <div class="panel__title">내 프로필</div>
          </div>
          <div class="profile-info" style="text-align: center; padding: 10px">
            <span style="font-size: 40px">🍃</span>
            <p
              id="userEmailDisplay"
              style="font-weight: 700; margin: 10px 0; font-size: 14px"
            ></p>
            <button class="btn btn--ghost w-full" id="logoutBtn">
              로그아웃
            </button>
          </div>
        </section>
      </aside>
    </div>

    <script type="module">
      // 1. Firebase 라이브러리 로드 (CDN 방식)
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        addDoc,
        query,
        where,
        getDocs,
        serverTimestamp,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      // 2. Firebase 설정 (제공해주신 설정값 적용)
      const firebaseConfig = {
        apiKey: "AIzaSyChA0UcWlJFZCVguYTdbdnMIRFlNL75ksE",
        authDomain: "note-80d93.firebaseapp.com",
        projectId: "note-80d93",
        storageBucket: "note-80d93.firebasestorage.app",
        messagingSenderId: "18402513428",
        appId: "1:18402513428:web:b791e7ddb164c518c04d01",
        measurementId: "G-ZWH5N0M0PV",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let currentUser = null; // 현재 로그인한 사용자 정보

      // ==========================================
      // [A] 로그인 / 회원가입 / 로그아웃 로직
      // ==========================================
      const emailInput =
        document.getElementById("loginEmail") ||
        document.querySelector('input[type="email"]');
      const pwInput =
        document.getElementById("loginPw") ||
        document.querySelector('input[type="password"]');

      // 회원가입
      document.getElementById("signupBtn").onclick = async () => {
        if (!emailInput.value || !pwInput.value)
          return alert("이메일과 비밀번호를 입력해주세요.");
        try {
          const userCredential = await createUserWithEmailAndPassword(
            auth,
            emailInput.value,
            pwInput.value,
          );
          alert("가족이 되신 걸 환영합니다! " + userCredential.user.email);
        } catch (error) {
          alert("회원가입 실패: " + error.message);
        }
      };

      // 로그인
      // [로그인 버튼 클릭 시]
      document.getElementById("loginBtn").onclick = async () => {
        let email = emailInput.value;
        const pw = pwInput.value;

        // 1. 도메인 자동 완성 (@가 없으면 @love2note.com을 붙여줌)
        if (email && !email.includes("@")) {
          email = email + "@love2note.com";
        }

        try {
          await signInWithEmailAndPassword(auth, email, pw);

          // 2. 아이디 저장 체크 여부에 따라 처리
          if (document.getElementById("saveIdCheck").checked) {
            // @ 앞부분만 저장할지, 전체를 저장할지 정할 수 있어요. 여기선 입력한 그대로 저장!
            localStorage.setItem("savedId", emailInput.value);
          } else {
            localStorage.removeItem("savedId");
          }

          alert("로그인 성공! 반가워요.");
        } catch (error) {
          alert("로그인 실패: 아이디 또는 비밀번호를 확인해 주세요.");
        }
      };

      // [페이지 로드 시 저장된 아이디 불러오기]
      // onAuthStateChanged 바로 위나 아래에 넣어주세요.
      const savedId = localStorage.getItem("savedId");
      if (savedId) {
        emailInput.value = savedId;
        document.getElementById("saveIdCheck").checked = true;
      }

      // 로그아웃 (추가된 버튼이 있을 경우 작동)
      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          signOut(auth).then(() => alert("로그아웃 되었습니다."));
        };
      }

      // 로그인 상태 감지 및 UI 업데이트
      onAuthStateChanged(auth, (user) => {
        const loginPanel = document.getElementById("login-panel");
        const userPanel = document.getElementById("user-panel");
        const emailDisplay = document.getElementById("userEmailDisplay");

        if (user) {
          currentUser = user;
          if (loginPanel) loginPanel.hidden = true;
          if (userPanel) userPanel.hidden = false;
          if (emailDisplay) emailDisplay.textContent = user.email;

          console.log("로그인됨:", user.uid);
          loadDailySchedules(user.uid); // 로그인 시 현재 선택된 날짜의 일정 로드
        } else {
          currentUser = null;
          if (loginPanel) loginPanel.hidden = false;
          if (userPanel) userPanel.hidden = true;
          document.getElementById("scheduleDisplay").textContent =
            "로그인 후 일정을 확인할 수 있습니다.";
        }
      });

      // ==========================================
      // [B] 뷰 전환 및 화면 제어 로직
      // ==========================================
      const sideItems = document.querySelectorAll(".sidelist__item[data-view]");
      const sections = {
        schedule: document.getElementById("view-schedule"),
        memo: document.getElementById("view-memo"),
        diary: document.getElementById("view-diary"),
        ledger: document.getElementById("view-ledger"),
      };

      function setView(viewName) {
        Object.keys(sections).forEach((key) => {
          if (sections[key]) sections[key].hidden = key !== viewName;
        });
        sideItems.forEach((item) => {
          item.classList.toggle("is-active", item.dataset.view === viewName);
        });
        const dashboard = document.getElementById("dashboard-area");
        if (dashboard) {
          dashboard.style.display = viewName === "schedule" ? "block" : "none";
        }
      }
      window.setView = setView; // HTML onclick에서 접근 가능하도록 전역 설정

      sideItems.forEach((item) => {
        item.addEventListener("click", (e) => {
          e.preventDefault();
          setView(item.dataset.view);
        });
      });

      // ==========================================
      // [C] 달력(Calendar) 관련 로직
      // ==========================================
      let today = new Date();
      let viewYear = today.getFullYear();
      let viewMonth = today.getMonth();

      const calGrid = document.getElementById("calendarGrid");
      const calYM = document.getElementById("calYM");
      const selectedDayNum = document.getElementById("selectedDayNum");
      const selectedDayName = document.getElementById("selectedDayName");

      function buildCalendar(y, m) {
        calGrid.innerHTML = "";
        calYM.textContent = `${y}.${String(m + 1).padStart(2, "0")}`;

        const firstDay = new Date(y, m, 1).getDay();
        const lastDate = new Date(y, m + 1, 0).getDate();
        const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

        dayNames.forEach((d) => {
          const div = document.createElement("div");
          div.className = "calendar-grid__wk";
          div.textContent = d;
          calGrid.appendChild(div);
        });

        for (let i = 0; i < firstDay; i++) {
          const div = document.createElement("div");
          calGrid.appendChild(div);
        }

        for (let d = 1; d <= lastDate; d++) {
          const btn = document.createElement("button");
          btn.className = "calendar-grid__day";
          btn.textContent = d;

          if (
            y === today.getFullYear() &&
            m === today.getMonth() &&
            d === today.getDate()
          ) {
            btn.classList.add("is-today");
          }

          btn.onclick = () => {
            document
              .querySelectorAll(".calendar-grid__day")
              .forEach((b) => b.classList.remove("is-selected"));
            btn.classList.add("is-selected");
            updateSelectedDate(y, m, d);
          };
          calGrid.appendChild(btn);
        }
        updateSelectedDate(y, m, today.getDate());
      }

      function updateSelectedDate(y, m, d) {
        const date = new Date(y, m, d);
        const weeks = [
          "일요일",
          "월요일",
          "화요일",
          "수요일",
          "목요일",
          "금요일",
          "토요일",
        ];
        selectedDayNum.textContent = d;
        selectedDayName.textContent = `(${weeks[date.getDay()]})`;

        // 날짜 클릭 시 해당 날짜의 폼 텍스트 업데이트 및 일정 새로고침
        const formDateText = document.getElementById("formDateText");
        if (formDateText)
          formDateText.textContent = `${y}.${String(m + 1).padStart(2, "0")}.${String(d).padStart(2, "0")}`;

        if (currentUser) loadDailySchedules(currentUser.uid);
      }

      document.getElementById("calPrev").onclick = () => {
        viewMonth--;
        if (viewMonth < 0) {
          viewMonth = 11;
          viewYear--;
        }
        buildCalendar(viewYear, viewMonth);
      };
      document.getElementById("calNext").onclick = () => {
        viewMonth++;
        if (viewMonth > 11) {
          viewMonth = 0;
          viewYear++;
        }
        buildCalendar(viewYear, viewMonth);
      };

      buildCalendar(viewYear, viewMonth);

      // ==========================================
      // [D] 일정(Schedule) 추가 및 로드 로직
      // ==========================================
      const toggleBtn = document.getElementById("toggleCalView");
      const calContainer = document.getElementById("calendarContainer");
      const openAddBtn = document.getElementById("openAddForm");
      const closeAddBtn = document.getElementById("closeAddForm");
      const scheduleForm = document.getElementById("scheduleForm");

      toggleBtn.onclick = () => {
        const isSummary = calContainer.classList.toggle("is-summary");
        toggleBtn.textContent = isSummary ? "자세히보기" : "간략히보기";
      };

      openAddBtn.onclick = () => {
        if (!currentUser) return alert("로그인 후 이용 가능합니다.");
        scheduleForm.hidden = false;
      };

      closeAddBtn.onclick = () => {
        scheduleForm.hidden = true;
      };

      // 일정 저장 버튼 이벤트
      document.getElementById("saveSchedule").onclick = async () => {
        if (!currentUser) return alert("로그인이 필요합니다!");

        const title = document.getElementById("schedTitle").value;
        const content = document.getElementById("schedContent").value;
        const dateStr = document.getElementById("formDateText").textContent;

        if (!title) return alert("제목을 입력해주세요!");

        try {
          await addDoc(collection(db, "schedules"), {
            uid: currentUser.uid,
            title: title,
            content: content,
            date: dateStr,
            createdAt: serverTimestamp(),
          });
          alert("일정이 저장되었습니다! 🍃");
          document.getElementById("schedTitle").value = "";
          document.getElementById("schedContent").value = "";
          scheduleForm.hidden = true;
          loadDailySchedules(currentUser.uid);
        } catch (e) {
          alert("저장 실패: " + e.message);
        }
      };

      // 일정 불러오기 함수
      async function loadDailySchedules(uid) {
        const selectedDate =
          document.getElementById("formDateText").textContent;
        const q = query(
          collection(db, "schedules"),
          where("uid", "==", uid),
          where("date", "==", selectedDate),
        );

        const querySnapshot = await getDocs(q);
        const display = document.getElementById("scheduleDisplay");
        display.innerHTML = "";

        if (querySnapshot.empty) {
          display.textContent = "등록된 일정이 없습니다.";
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const item = document.createElement("div");
          item.style.padding = "10px";
          item.style.borderBottom = "1px solid var(--line)";
          item.innerHTML = `<strong>${data.title}</strong><p style="margin:5px 0 0; font-size:14px; color:var(--muted);">${data.content}</p>`;
          display.appendChild(item);
        });
      }
    </script>
  </body>
</html>
